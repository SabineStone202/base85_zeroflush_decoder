[project]
name = "base85-zeroflush-decoder"
version = "0.1.2"
description = "Encodes and decodes ZeroMQ Z85 encoding, a variant of Ascii85 for use in ZeroMQ protocol."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
